<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion Games - 体感小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      opacity: 0.6;
      margin-bottom: 48px;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 900px;
      width: 100%;
    }
    .game-card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .game-card:active { transform: scale(0.97); }
    .game-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 100%);
    }
    .game-info {
      padding: 16px 20px;
    }
    .game-info h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .game-info p {
      font-size: 14px;
      opacity: 0.6;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: rgba(76,175,80,0.3);
      color: #81C784;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 10px;
      margin-top: 8px;
    }
    .coming-soon .game-thumb {
      background: linear-gradient(180deg, #333 0%, #555 100%);
      opacity: 0.5;
    }
    .coming-soon { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <h1>🎮 Motion Games</h1>
  <p class="subtitle">用摄像头和手势玩游戏</p>

  <div class="games">
    <a class="game-card" href="/balloon-popper/">
      <div class="game-thumb">🎈</div>
      <div class="game-info">
        <h2>气球捏捏乐</h2>
        <p>伸出手，捏合手指戳破飞上来的气球！小心炸弹！</p>
        <span class="badge">可以玩</span>
      </div>
    </a>

    <div class="game-card coming-soon">
      <div class="game-thumb">🧲</div>
      <div class="game-info">
        <h2>魔法物理沙盒</h2>
        <p>用手推动物体、操控重力，创造属于你的物理世界。</p>
        <span class="badge" style="background:rgba(255,193,7,0.3);color:#FFD54F;">即将推出</span>
      </div>
    </div>

    <a class="game-card" href="/roaring-motorbike/">
      <div class="game-thumb" style="background: linear-gradient(180deg, #FF6F00 0%, #E65100 100%);">🏍️</div>
      <div class="game-info">
        <h2>咆哮摩托</h2>
        <p>歪头转向、大声吼叫加速，在公路上狂飙！</p>
        <span class="badge">可以玩</span>
      </div>
    </a>
  </div>
</body>
</html>
